# Temporary branch-only dispatch entry point. Never merge into development.
name: Ordinary Profiling Experiment (NOT ACCEPTANCE)
run-name: Ordinary profiling only — ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact independently reviewed profiling candidate SHA
        type: string
        required: true

concurrency:
  group: ordinary-profiling-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  profiling-preflight:
    name: Profiling preflight (NOT ACCEPTANCE)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Require manually authorized profiling SHA and frozen baseline
        shell: bash
        env:
          EXPECTED_PROFILE_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = ahmedali5696/care-pulse-3
          test "$GITHUB_REF" = refs/heads/feature/ci-scalability
          test "$GITHUB_WORKFLOW" = 'Ordinary Profiling Experiment (NOT ACCEPTANCE)'
          test "$GITHUB_WORKFLOW_REF" = 'ahmedali5696/care-pulse-3/.github/workflows/foundation.yml@refs/heads/feature/ci-scalability'
          [[ "$EXPECTED_PROFILE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_PROFILE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 0c325ce80a999b79f7e442b39c4b0ecbc55fea9d
          test -z "$(git status --porcelain)"
          echo 'PROFILING ONLY — NOT FULL FOUNDATION ACCEPTANCE'

      - name: Verify runner and install pinned PowerShell 7
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$ImageOS" = ubuntu24
          echo "Runner: $ImageOS $ImageVersion, $(uname -sm), SHA $GITHUB_SHA"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pwsh.tar.gz" https://github.com/PowerShell/PowerShell/releases/download/v7.6.7/powershell-7.6.7-linux-x64.tar.gz
          echo "6896f9e3a6b0a354bf470835a96da76d2f801cd50dcf047ad7c4563bf93bf431  $RUNNER_TEMP/pwsh.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pwsh"
          tar -xzf "$RUNNER_TEMP/pwsh.tar.gz" -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pwsh/pwsh" -NoProfile -Command 'if ($PSVersionTable.PSVersion.ToString() -ne "7.6.7") { exit 1 }'

      # The release archive contains all Python bootstrap bytes, including
      # ensurepip. Do not execute its setup.sh (which upgrades pip unpinned).
      - name: Install SHA-256 verified prebuilt CPython 3.13.16
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/python-3.13.16-linux-24.04-x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" https://github.com/actions/python-versions/releases/download/3.13.16-36805956071/python-3.13.16-linux-24.04-x64.tar.gz
          echo "d6f5f504043400592e9dcf368ba262c64d998608646cc22281b5a75beecbc872  $archive" | sha256sum -c -
          sha256sum "$archive"
          mkdir -p "$RUNNER_TEMP/python-3.13.16"
          tar -xzf "$archive" -C "$RUNNER_TEMP/python-3.13.16"
          # The prebuilt ELF resolves libpython from the verified archive's lib/.
          export LD_LIBRARY_PATH="$RUNNER_TEMP/python-3.13.16/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          PYTHON="$RUNNER_TEMP/python-3.13.16/bin/python3.13"
          "$PYTHON" - <<'PY'
          import platform
          import sys
          import sysconfig

          assert sys.implementation.name == "cpython"
          assert sys.version_info[:3] == (3, 13, 16)
          assert platform.machine() == "x86_64"
          assert not sysconfig.get_config_var("Py_GIL_DISABLED")
          print("PASS exact standard-GIL CPython 3.13.16 x64")
          PY
          "$PYTHON" -m venv "$RUNNER_TEMP/foundation-venv"

      # Cached wheels still pass pip's required SHA-256 checks on installation.
      - name: Cache pip downloads for exact approved lock
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: foundation-ubuntu24-x64-python3.13.16-pip26.2.2-${{ hashFiles('requirements.lock') }}

      - name: Secure installer bootstrap and frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/foundation-venv/bin/python"
          "$PY" -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          "$PY" -c 'import pip, sys; assert pip.__version__ == "26.2.2"; assert sys.version_info[:3] == (3, 13, 16)'
          "$PY" -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          echo "$RUNNER_TEMP/foundation-venv/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/node.tar.xz" https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz
          echo "6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/node-v24.22.1-linux-x64/bin:$PATH"
          test "$(node --version)" = v24.22.1
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.34.7
          echo "$RUNNER_TEMP/node-v24.22.1-linux-x64/bin" >> "$GITHUB_PATH"

      # Cache the content-addressed store, never node_modules or an installed environment.
      # Frozen pnpm install and approved-lock fingerprint checks remain mandatory.
      - name: Cache pnpm store for exact approved lock
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: foundation-ubuntu24-x64-node24.22.1-pnpm10.34.7-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Check unchanged common gates privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/ordinary-profile-preflight"
          test ! -e "$private"
          mkdir -m 0700 "$private"
          trap 'status=$?; rm -rf -- "$private" && test ! -e "$private" || status=1; exit "$status"' EXIT
          export RUNNER_TEMP="$private"
          for check in inputs python-quality unit imports web; do
            if pwsh -NoProfile -File ops/check.ps1 "$check" > "$private/$check.log" 2>&1; then
              printf 'Profiling preflight %s passed\n' "$check"
            else
              status=$?
              printf 'FAIL profiling preflight %s (exit %s; output withheld)\n' "$check" "$status"
              exit "$status"
            fi
          done

  profiling-ordinary:
    name: Ordinary ${{ matrix.variant }} profiling only (NOT ACCEPTANCE)
    needs: profiling-preflight
    strategy:
      fail-fast: false
      matrix:
        variant: [control, instrumented]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CP_B04_SPIKE: 'false'
      CP_T133_MODE: 'false'
      CP_FOUNDATION_MODE: ordinary-profile
      CP_FOUNDATION_LANE: ordinary
      CP_ORDINARY_PROFILE_VARIANT: ${{ matrix.variant }}
      CP_ORDINARY_PROFILE_SHA: ${{ inputs.expected_sha }}
      COMPOSE_PROJECT_NAME: ${{ format('carepulse-ci-{0}-{1}{2}', github.run_id, github.run_attempt, matrix.variant == 'control' && '4' || '5') }}
      CP_CI_PROJECT: ${{ format('carepulse-ci-{0}-{1}{2}', github.run_id, github.run_attempt, matrix.variant == 'control' && '4' || '5') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Require manually authorized profiling SHA and frozen baseline
        shell: bash
        env:
          EXPECTED_PROFILE_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = ahmedali5696/care-pulse-3
          test "$GITHUB_REF" = refs/heads/feature/ci-scalability
          test "$GITHUB_WORKFLOW" = 'Ordinary Profiling Experiment (NOT ACCEPTANCE)'
          test "$GITHUB_WORKFLOW_REF" = 'ahmedali5696/care-pulse-3/.github/workflows/foundation.yml@refs/heads/feature/ci-scalability'
          [[ "$EXPECTED_PROFILE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_PROFILE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 0c325ce80a999b79f7e442b39c4b0ecbc55fea9d
          test -z "$(git status --porcelain)"
          echo 'PROFILING ONLY — NOT FULL FOUNDATION ACCEPTANCE'

      - name: Set runner-scoped synthetic secret paths and environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CP_DB_PASSWORD_FILE=$RUNNER_TEMP/foundation-ci-private/postgres-password"
            echo "CP_RUNTIME_DB_PASSWORD_FILE=$RUNNER_TEMP/foundation-ci-private/runtime-db-password"
            echo "CP_WEB_DB_PASSWORD_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/web-db-password"
            echo "CP_API_DB_PASSWORD_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/api-db-password"
            echo "CP_WORKER_DB_PASSWORD_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/worker-db-password"
            echo "CP_GATE_DB_PASSWORD_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/gate-db-password"
            echo "CP_DB_IDENTITY_KEY_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/db-identity-key"
            echo "CP_DB_IDENTITY_KEY_ID=synthetic-db-ci-v1"
            echo "CP_AUTH_DB_PASSWORD_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/auth-db-password"
            echo "CP_MIGRATION_SECRET_FILE=$RUNNER_TEMP/foundation-ci-private/migration-password"
            echo "CP_OPERATOR_SECRET_FILE=$RUNNER_TEMP/foundation-ci-private/operator-password"
            echo "CP_OPERATOR_DB_PASSWORD_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/operator-password"
            echo "CP_OPERATOR_CREDENTIAL_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/operator-credential"
            echo "CP_SENDER_DB_PASSWORD_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/sender-password"
            echo "CP_DELIVERY_PUBLIC_KEY_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/delivery-public.pem"
            echo "CP_DELIVERY_PRIVATE_KEY_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/delivery-private.pem"
            echo "CP_DELIVERY_KEY_ID=synthetic-ci-delivery-v1"
            echo "CP_DELIVERY_PRIVATE_KEY_FILES=synthetic-ci-delivery-v1=/run/secrets/delivery_private_key"
            echo "CP_MAIL_BASE_URL=http://127.0.0.1:3000"
            echo "CP_DELIVERY_LEASE_SECONDS=30"
            echo "CP_DELIVERY_ATTEMPT_TIMEOUT_SECONDS=5"
            echo "CP_DELIVERY_MAX_ATTEMPTS=3"
            echo "CP_DELIVERY_RETRY_SECONDS=2"
            echo "CP_SERVICE_KEY_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/service-key"
            echo "CP_AUTH_SECRET_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/auth-secret"
            echo "CP_FILE_ENCRYPTION_KEY_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/file-key"
            echo "CP_ACTIVE_POLICY_SOURCE_FILE=$GITHUB_WORKSPACE/tests/fixtures/foundation-policy.json"
            echo "CP_ENV=test"
            echo "CP_SYNTHETIC_TEST_PROFILE=true"
            echo "CP_DB_HOST=db"
            echo "CP_DB_PORT=5432"
            echo "CP_DB_NAME=carepulse"
            echo "CP_INTERNAL_API_URL=http://api:8000"
            echo "CP_SIGNING_KEY_ID=synthetic-ci-v1"
            echo "CP_RECOVERY_FINGERPRINT_KEY_VERSION=synthetic-ci-v1"
            echo "CP_MAIL_ENABLED=false"
            echo "CP_SCAN_ENABLED=false"
          } >> "$GITHUB_ENV"

      - name: Install approved PowerShell, Docker Engine and plugins
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$ImageOS" = ubuntu24
          echo "Runner: $ImageOS $ImageVersion, $(uname -sm), SHA $GITHUB_SHA"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pwsh.tar.gz" https://github.com/PowerShell/PowerShell/releases/download/v7.6.7/powershell-7.6.7-linux-x64.tar.gz
          echo "6896f9e3a6b0a354bf470835a96da76d2f801cd50dcf047ad7c4563bf93bf431  $RUNNER_TEMP/pwsh.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pwsh"
          tar -xzf "$RUNNER_TEMP/pwsh.tar.gz" -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"
          # Only reuse a hosted installation if every approved package and
          # daemon/plugin version matches. Otherwise retain the pinned install.
          if [ "$(dpkg-query -W -f='${Version}' docker-ce 2>/dev/null || true)" = '5:29.9.2-1~ubuntu.24.04~noble' ] &&
             [ "$(dpkg-query -W -f='${Version}' docker-ce-cli 2>/dev/null || true)" = '5:29.9.2-1~ubuntu.24.04~noble' ] &&
             [ "$(dpkg-query -W -f='${Version}' containerd.io 2>/dev/null || true)" = '2.4.2-3~ubuntu.24.04~noble' ] &&
             [ "$(dpkg-query -W -f='${Version}' docker-compose-plugin 2>/dev/null || true)" = '5.6.1-1~ubuntu.24.04~noble' ] &&
             [ "$(dpkg-query -W -f='${Version}' docker-buildx-plugin 2>/dev/null || true)" = '0.38.1-1~ubuntu.24.04~noble' ] &&
             [ "$(docker version --format '{{.Server.Version}}' 2>/dev/null || true)" = 29.9.2 ] &&
             [ "$(docker version --format '{{.Client.Version}}' 2>/dev/null || true)" = 29.9.2 ] &&
             [ "$(docker compose version --short 2>/dev/null || true)" = 5.6.1 ] &&
             docker buildx version 2>/dev/null | grep -Fq 'v0.38.1'; then
            echo 'PASS preinstalled approved Docker Engine and plugins'
          else
            echo 'Installing approved Docker Engine and plugins'
            for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              if [ -f "$source" ] && grep -Fq 'packages.microsoft.com/ubuntu/24.04/prod' "$source"; then
                sudo mv "$source" "$source.carepulse-ci-disabled"
              fi
            done
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
            sudo chmod a+r /etc/apt/keyrings/docker.gpg
            echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable' | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --allow-downgrades \
              docker-ce=5:29.9.2-1~ubuntu.24.04~noble \
              docker-ce-cli=5:29.9.2-1~ubuntu.24.04~noble \
              containerd.io=2.4.2-3~ubuntu.24.04~noble \
              docker-compose-plugin=5.6.1-1~ubuntu.24.04~noble \
              docker-buildx-plugin=0.38.1-1~ubuntu.24.04~noble
            sudo systemctl restart docker
          fi
          test "$(docker version --format '{{.Server.Version}}')" = 29.9.2
          test "$(docker version --format '{{.Client.Version}}')" = 29.9.2
          test "$(docker compose version --short)" = 5.6.1
          docker buildx version | grep -F 'v0.38.1'
          test "$(dpkg-query -W -f='${Version}' containerd.io)" = '2.4.2-3~ubuntu.24.04~noble'
          test "$(dpkg-query -W -f='${Version}' docker-ce)" = '5:29.9.2-1~ubuntu.24.04~noble'
          test "$(dpkg-query -W -f='${Version}' docker-ce-cli)" = '5:29.9.2-1~ubuntu.24.04~noble'
          test "$(dpkg-query -W -f='${Version}' docker-compose-plugin)" = '5.6.1-1~ubuntu.24.04~noble'
          test "$(dpkg-query -W -f='${Version}' docker-buildx-plugin)" = '0.38.1-1~ubuntu.24.04~noble'

      - name: Install pinned Playwright browser on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/node.tar.xz" https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz
          echo "6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v24.22.1-linux-x64/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/node-v24.22.1-linux-x64/bin:$PATH"
          test "$(node --version)" = v24.22.1
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.34.7
          pnpm install --frozen-lockfile
          pnpm --filter @carepulse/web exec playwright install --with-deps chromium

      - name: Run the complete Ordinary sequence with private output
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/ordinary-profile-private"
          output="$RUNNER_TEMP/ordinary-profile-timing.json"
          test ! -e "$private" && test ! -e "$output"
          mkdir -m 0700 "$private"
          finish() {
            local status=$?
            trap - EXIT
            if [[ -d "$private" && -O "$private" && ! -L "$private" ]]; then
              rm -rf -- "$private" && test ! -e "$private" || status=1
            else
              status=1
            fi
            if [ "$status" -ne 0 ]; then
              rm -f -- "$output"
              echo 'FAIL profiling-only run or cleanup; raw output withheld'
            fi
            exit "$status"
          }
          trap finish EXIT
          export GITHUB_STEP_SUMMARY="$private/step-summary"
          test "$(pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')" = 7.6.7
          if pwsh -NoProfile -File ops/check.ps1 integration > "$private/controller.log" 2>&1; then
            python3 -m ops.profile_ordinary_report publish "$private" "$output" > "$private/publish.log" 2>&1
          else
            status=$?
            printf 'FAIL Ordinary profiling controller (exit %s; private output withheld)\n' "$status"
            exit "$status"
          fi
          test -f "$output" && test ! -L "$output"
          test ! -e "$RUNNER_TEMP/foundation-ci-private"
          echo 'Profiling-only evidence validated after scoped cleanup; 1051 mandatory cases, zero skips'

      - name: Upload sanitized profiling timing only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: ordinary-profile-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ordinary-profile-timing.json
          archive: true
          overwrite: false
          include-hidden-files: false
          if-no-files-found: error
