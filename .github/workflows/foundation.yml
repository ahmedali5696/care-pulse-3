name: Foundation

on:
  push:
    branches: [feature/wave-0-foundation, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inputs-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner and install pinned PowerShell 7
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$ImageOS" = ubuntu24
          echo "Runner: $ImageOS $ImageVersion, $(uname -sm)"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pwsh.tar.gz" https://github.com/PowerShell/PowerShell/releases/download/v7.6.7/powershell-7.6.7-linux-x64.tar.gz
          echo "6896f9e3a6b0a354bf470835a96da76d2f801cd50dcf047ad7c4563bf93bf431  $RUNNER_TEMP/pwsh.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pwsh"
          tar -xzf "$RUNNER_TEMP/pwsh.tar.gz" -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pwsh/pwsh" -NoProfile -Command 'if ($PSVersionTable.PSVersion.ToString() -ne "7.6.7") { exit 1 }'

      - name: Build exact CPython 3.13.16 from verified official source
        shell: bash
        run: |
          set -euo pipefail
          # Hosted Ubuntu images may include an unrelated Microsoft apt feed.
          # Its occasional 403 must not block pinned official Ubuntu packages.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -Fq 'packages.microsoft.com/ubuntu/24.04/prod' "$source"; then
              sudo mv "$source" "$source.carepulse-ci-disabled"
              echo 'Excluded unrelated Microsoft apt feed on disposable runner'
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libffi-dev liblzma-dev uuid-dev
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/Python-3.13.16.tar.xz" https://www.python.org/ftp/python/3.13.16/Python-3.13.16.tar.xz
          echo "f4b1bfb3c79b5bb11b8d228a12504163b4c0dab4d679828d8f5f26b6cb6ab35d  $RUNNER_TEMP/Python-3.13.16.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/python-src"
          tar -xJf "$RUNNER_TEMP/Python-3.13.16.tar.xz" -C "$RUNNER_TEMP/python-src" --strip-components=1
          cd "$RUNNER_TEMP/python-src"
          ./configure --prefix="$RUNNER_TEMP/python-3.13.16" --with-ensurepip=install > "$RUNNER_TEMP/python-configure.log" 2>&1
          make -j 4 > "$RUNNER_TEMP/python-make.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/python-make.log"; exit 1; }
          make install > "$RUNNER_TEMP/python-install.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/python-install.log"; exit 1; }
          "$RUNNER_TEMP/python-3.13.16/bin/python3.13" --version
          "$RUNNER_TEMP/python-3.13.16/bin/python3.13" -m venv "$RUNNER_TEMP/foundation-venv"

      - name: Verify frozen Linux installs, imports and web
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/foundation-venv/bin/python"
          "$PY" -m pip install --no-cache-dir "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          "$PY" -c 'import pip, sys; assert pip.__version__ == "26.2.2"; assert sys.version_info[:3] == (3, 13, 16)'
          "$PY" -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          "$PY" -m pip check
          PYTHONPATH=apps/api:. "$PY" -c 'from carepulse.main import app; import apps.worker.main; assert set(app.openapi()["paths"]) == {"/health/live", "/health/ready"}; assert app.openapi_url is None'
          "$PY" -m ruff check apps/api apps/worker db tests
          "$PY" -m ruff format --check apps/api apps/worker db tests
          PYTHONPATH=apps/api:. "$PY" -m pytest -q tests/unit/test_config.py tests/unit/test_db.py tests/unit/test_health.py
          PYTHONPATH=apps/api "$PY" -m alembic heads | grep -Fx '0001_foundation (head)'

          curl -fsSL --retry 3 -o "$RUNNER_TEMP/node.tar.xz" https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz
          echo "6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/node-v24.22.1-linux-x64/bin:$PATH"
          test "$(node --version)" = v24.22.1
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.34.7
          test "$(pnpm --version)" = 10.34.7
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm build
          pwsh -NoProfile -Command 'if ($PSVersionTable.PSVersion.ToString() -ne "7.6.7") { exit 1 }; Write-Output "Verified PowerShell 7.6.7"'
          {
            echo '### F-01 Linux pinned inputs/build'
            echo '- CPython 3.13.16, pip 26.2.2, hash-locked Linux wheels: verified'
            echo '- Node 24.22.1, pnpm 10.34.7, frozen lock, type/lint/Next build: verified'
            echo '- Python imports, Ruff lint/format and PowerShell 7.6.7: verified'
          } >> "$GITHUB_STEP_SUMMARY"

  compose-integration:
    needs: inputs-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: carepulse-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CP_CI_PROJECT: carepulse-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set runner-scoped synthetic secret paths and environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CP_DB_PASSWORD_FILE=$RUNNER_TEMP/foundation-ci-private/postgres-password"
            echo "CP_RUNTIME_DB_PASSWORD_FILE=$RUNNER_TEMP/foundation-ci-private/runtime-db-password"
            echo "CP_MIGRATION_SECRET_FILE=$RUNNER_TEMP/foundation-ci-private/migration-password"
            echo "CP_OPERATOR_SECRET_FILE=$RUNNER_TEMP/foundation-ci-private/operator-password"
            echo "CP_SERVICE_KEY_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/service-key"
            echo "CP_AUTH_SECRET_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/auth-secret"
            echo "CP_FILE_ENCRYPTION_KEY_SOURCE_FILE=$RUNNER_TEMP/foundation-ci-private/file-key"
            echo "CP_ACTIVE_POLICY_SOURCE_FILE=$GITHUB_WORKSPACE/tests/fixtures/foundation-policy.json"
            echo "CP_ENV=test"
            echo "CP_SYNTHETIC_TEST_PROFILE=true"
            echo "CP_DB_HOST=db"
            echo "CP_DB_PORT=5432"
            echo "CP_DB_NAME=carepulse"
            echo "CP_DB_USER=carepulse_runtime"
            echo "CP_INTERNAL_API_URL=http://api:8000"
            echo "CP_MAIL_ENABLED=false"
            echo "CP_SCAN_ENABLED=false"
          } >> "$GITHUB_ENV"

      - name: Install approved Docker Engine and plugins from signed Ubuntu repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$ImageOS" = ubuntu24
          echo "Runner: $ImageOS $ImageVersion, $(uname -sm)"
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -Fq 'packages.microsoft.com/ubuntu/24.04/prod' "$source"; then
              sudo mv "$source" "$source.carepulse-ci-disabled"
              echo 'Excluded unrelated Microsoft apt feed on disposable runner'
            fi
          done
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
          sudo chmod a+r /etc/apt/keyrings/docker.gpg
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable' | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades \
            docker-ce=5:29.9.2-1~ubuntu.24.04~noble \
            docker-ce-cli=5:29.9.2-1~ubuntu.24.04~noble \
            containerd.io=2.4.2-3~ubuntu.24.04~noble \
            docker-compose-plugin=5.6.1-1~ubuntu.24.04~noble \
            docker-buildx-plugin=0.38.1-1~ubuntu.24.04~noble
          sudo systemctl restart docker
          test "$(docker version --format '{{.Server.Version}}')" = 29.9.2
          test "$(docker version --format '{{.Client.Version}}')" = 29.9.2
          test "$(docker compose version --short)" = 5.6.1
          docker buildx version | grep -F 'v0.38.1'
          test "$(dpkg-query -W -f='${Version}' containerd.io)" = '2.4.2-3~ubuntu.24.04~noble'

      - name: Validate disposable topology and exact Linux amd64 image identities
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 0700 "$RUNNER_TEMP/foundation-ci-private"
          openssl rand -hex 32 > "$CP_DB_PASSWORD_FILE"
          openssl rand -hex 32 > "$CP_RUNTIME_DB_PASSWORD_FILE"
          openssl rand -hex 32 > "$CP_MIGRATION_SECRET_FILE"
          openssl rand -hex 32 > "$CP_OPERATOR_SECRET_FILE"
          openssl rand -hex 32 > "$CP_SERVICE_KEY_SOURCE_FILE"
          openssl rand -hex 32 > "$CP_AUTH_SECRET_SOURCE_FILE"
          openssl rand -hex 32 > "$CP_FILE_ENCRYPTION_KEY_SOURCE_FILE"
          # Compose bind-mounted secrets keep host file permissions; test UID 65532
          # requires read-only world-readability inside a private runner-only directory.
          chmod 0444 "$CP_DB_PASSWORD_FILE" "$CP_RUNTIME_DB_PASSWORD_FILE" "$CP_SERVICE_KEY_SOURCE_FILE" "$CP_AUTH_SECRET_SOURCE_FILE" "$CP_FILE_ENCRYPTION_KEY_SOURCE_FILE"
          chmod 0444 "$CP_MIGRATION_SECRET_FILE" "$CP_OPERATOR_SECRET_FILE"
          docker compose --profile mail --profile scan --profile test config --quiet
          docker compose --profile mail --profile scan --profile test config --format json > "$RUNNER_TEMP/foundation-ci-private/compose.json"
          chmod 0444 "$RUNNER_TEMP/foundation-ci-private/compose.json"
          test "$COMPOSE_PROJECT_NAME" = "$CP_CI_PROJECT"
          for image in \
            'node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205' \
            'python:3.13.16-slim-bookworm@sha256:73aa5faee130c60da030e105ec971ccf57473fbd22ce73bd6fc9ba99a40b838d' \
            'postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27' \
            'axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387' \
            'clamav/clamav:1.5.4-debian13-slim@sha256:d7ede3cefeaf3b8a72ebcdee849d13f504bbca3f3b3cfade5bc7b6ee06a4f62c'
          do
            docker pull --platform linux/amd64 --quiet "$image" > /dev/null
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
            echo "Verified pinned Linux amd64 image: ${image%%@*}"
          done

      - name: F-04 controlled roles, explicit migration and real PostgreSQL acceptance
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile test build --pull
          docker compose up -d --no-build db
          for attempt in $(seq 1 40); do
            if docker compose exec -T db pg_isready -U carepulse_bootstrap -d carepulse > /dev/null 2>&1; then break; fi
            if [ "$attempt" = 40 ]; then echo 'FAIL F-04 disposable database startup'; exit 1; fi
            sleep 2
          done
          # Values stay in this controlled psql process, never in command arguments.
          export CP_MIGRATION_PASSWORD="$(cat "$CP_MIGRATION_SECRET_FILE")"
          export CP_RUNTIME_PASSWORD="$(cat "$CP_RUNTIME_DB_PASSWORD_FILE")"
          export CP_OPERATOR_PASSWORD="$(cat "$CP_OPERATOR_SECRET_FILE")"
          if ! docker compose exec -T -e CP_MIGRATION_PASSWORD -e CP_RUNTIME_PASSWORD -e CP_OPERATOR_PASSWORD \
            db psql --no-psqlrc -U carepulse_bootstrap -d carepulse < db/roles.sql \
            > "$RUNNER_TEMP/foundation-ci-private/roles.log" 2>&1; then
            echo 'FAIL F-04 controlled role setup (diagnostics withheld to protect credentials)'; exit 1
          fi
          unset CP_MIGRATION_PASSWORD CP_RUNTIME_PASSWORD CP_OPERATOR_PASSWORD
          docker compose --profile test run --rm --no-deps \
            -e CP_DB_HOST=db -e CP_DB_PORT=5432 -e CP_DB_NAME=carepulse \
            -e CP_MIGRATION_PASSWORD_FILE=/run/secrets/migration_password \
            -v "$CP_MIGRATION_SECRET_FILE:/run/secrets/migration_password:ro" \
            test python -m alembic -c alembic.ini upgrade head
          docker compose --profile test run --rm --no-deps \
            -e CP_CI_PROJECT="$CP_CI_PROJECT" \
            -e CP_COMPOSE_CONFIG_PATH=/tmp/foundation-compose.json \
            -v "$RUNNER_TEMP/foundation-ci-private/compose.json:/tmp/foundation-compose.json:ro" \
            -v "$CP_RUNTIME_DB_PASSWORD_FILE:/run/secrets/runtime_db_password:ro" \
            -v "$CP_MIGRATION_SECRET_FILE:/run/secrets/migration_password:ro" \
            -v "$CP_OPERATOR_SECRET_FILE:/run/secrets/operator_password:ro" \
            test python -m pytest -q -ra --tb=short -p no:cacheprovider tests/integration/test_database.py
          {
            echo '### F-04 PostgreSQL baseline'
            echo '- Sole revision: 0001_foundation; explicit migration-role upgrade'
            echo '- Empty database/reset/repeated upgrade and failing migration rollback: passed'
            echo '- Runtime/operator DDL, version-write and role-escalation denials: passed'
            echo '- Same-connection context cleanup after commit/rollback/SQL error/cancellation: passed'
            echo '- No clinical schema or clinical RLS acceptance claimed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Runner/web/test vantage probes and persistence after recreation
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --no-build db api worker web
          for attempt in $(seq 1 40); do
            if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:3000/ > /dev/null 2>&1; then break; fi
            if [ "$attempt" = 40 ]; then echo 'FAIL runner-host web endpoint'; exit 1; fi
            sleep 2
          done
          echo 'PASS runner-host web http://127.0.0.1:3000/'
          for port in 8000 5432; do
            if timeout 3 bash -c "echo > /dev/tcp/127.0.0.1/$port" 2>/dev/null; then
              echo "FAIL runner-host unexpected exposed port $port"; exit 1
            fi
            echo "PASS runner-host denied port $port"
          done
          docker compose exec -T web node -e 'fetch("http://api:8000/__foundation_network_probe__").then(r => process.exit(r.status === 404 ? 0 : 1)).catch(() => process.exit(1))'
          echo 'PASS web-container -> private API HTTP 404'
          docker compose exec -T db postgres --version | grep -F '17.11'
          docker compose exec -T web node --version | grep -Fx 'v24.22.1'
          docker compose exec -T api python --version | grep -F '3.13.16'
          docker compose exec -T api python -m pip --version | grep -F '26.2.2'
          docker compose exec -T api python -c 'from carepulse.config import load_config; load_config("api")'
          docker compose exec -T worker python -c 'from carepulse.config import load_config; load_config("worker")'

          for phase in seed verify; do
            if [ "$phase" = verify ]; then
              docker compose up -d --force-recreate --no-deps db api
            fi
            docker compose --profile test run --rm --no-deps \
              -e CP_CI_PROJECT="$CP_CI_PROJECT" \
              -e CP_PERSIST_PHASE="$phase" \
              -e CP_COMPOSE_CONFIG_PATH=/tmp/foundation-compose.json \
              -v "$RUNNER_TEMP/foundation-ci-private/compose.json:/tmp/foundation-compose.json:ro" \
              test python -m pytest -q -ra -p no:cacheprovider tests/integration/test_topology.py
            echo "PASS network-attached test-container topology, API and synthetic DB/file markers: $phase"
          done
          docker compose exec -T web node -e 'fetch("http://api:8000/__foundation_network_probe__").then(r => process.exit(r.status === 404 ? 0 : 1)).catch(() => process.exit(1))'
          docker compose --profile test run --rm --no-deps -e CI=true \
            -v "$GITHUB_WORKSPACE/tests:/srv/tests:ro" \
            api python -m pytest -q -ra -p no:cacheprovider tests/integration/test_secrets.py

          # Negative protected process startup must stop nonzero for each absent key.
          # Failure output stays in a private aggregate (never printed).
          : > "$RUNNER_TEMP/foundation-ci-private/denials.log"
          for key in CP_POLICY_FILE CP_DB_PASSWORD_FILE CP_SERVICE_KEY_FILE CP_AUTH_SECRET_FILE; do
            log="$RUNNER_TEMP/foundation-ci-private/web-denial.log"
            set +e
            timeout 15s docker compose run --rm --no-deps -e "$key=/run/secrets/missing" web > "$log" 2>&1
            code=$?
            set -e
            cat "$log" >> "$RUNNER_TEMP/foundation-ci-private/denials.log"
            if [ "$code" -eq 0 ] || [ "$code" -eq 124 ] || ! grep -Fq "$key" "$log"; then
              echo "FAIL web protected startup missing $key (exit $code)"; exit 1
            fi
            echo "PASS web protected startup denies missing $key"
          done
          worker_id="$(docker compose ps -q worker)"
          test -n "$worker_id"
          test "$(docker inspect --format '{{.State.Running}}' "$worker_id")" = true
          for key in CP_POLICY_FILE CP_DB_PASSWORD_FILE CP_FILE_ENCRYPTION_KEY_FILE; do
            log="$RUNNER_TEMP/foundation-ci-private/worker-denial.log"
            set +e
            timeout 10s docker compose run --rm --no-deps -e "$key=/run/secrets/missing" worker > "$log" 2>&1
            code=$?
            set -e
            cat "$log" >> "$RUNNER_TEMP/foundation-ci-private/denials.log"
            if [ "$code" -eq 0 ] || [ "$code" -eq 124 ] || ! grep -Fq "$key" "$log"; then
              echo "FAIL worker protected startup missing $key (exit $code)"; exit 1
            fi
            echo "PASS worker protected startup denies missing $key"
          done

          # A single private pattern file prevents printing any generated synthetic value.
          canaries="$RUNNER_TEMP/foundation-ci-private/canaries"
          cat "$CP_DB_PASSWORD_FILE" "$CP_RUNTIME_DB_PASSWORD_FILE" \
            "$CP_SERVICE_KEY_SOURCE_FILE" "$CP_AUTH_SECRET_SOURCE_FILE" \
            "$CP_FILE_ENCRYPTION_KEY_SOURCE_FILE" "$CP_MIGRATION_SECRET_FILE" \
            "$CP_OPERATOR_SECRET_FILE" > "$canaries"
          # A nonroot web image must read the read-only bind-mounted pattern
          # file. The owning runner directory remains 0700 and is disposable.
          chmod 0444 "$canaries"
          awk 'length($0) != 64 || $0 !~ /^[0-9a-f]+$/ { invalid=1 } END { if (NR != 7 || invalid) exit 1 }' "$canaries" || {
            echo 'FAIL malformed synthetic canary patterns'; exit 1;
          }
          if git grep -I -q -f "$canaries" -- apps tests compose.yaml; then
            echo 'FAIL synthetic key in tracked source'; exit 1
          else
            code=$?
            if [ "$code" -ne 1 ]; then echo 'FAIL tracked-source scan error'; exit 1; fi
          fi
          docker compose logs --no-color web api worker > "$RUNNER_TEMP/foundation-ci-private/runtime-logs"
          if grep -aF -f "$canaries" "$RUNNER_TEMP/foundation-ci-private/runtime-logs" "$RUNNER_TEMP/foundation-ci-private/denials.log" > /dev/null; then
            echo 'FAIL synthetic key in runtime logs'; exit 1
          else
            code=$?
            if [ "$code" -ne 1 ]; then echo 'FAIL runtime-log scan error'; exit 1; fi
          fi
          docker compose run --rm --no-deps \
            -v "$canaries:/tmp/canaries:ro" web sh -c \
            'if [ ! -r /tmp/canaries ]; then
               echo "FAIL nonroot web canary input unreadable"; exit 2
             fi
             result=0
             grep -aRF -f /tmp/canaries /workspace/apps/web/.next /workspace/apps/web/app > /dev/null || result=$?
             case "$result" in
               0)
                 echo "FAIL web source/build canary match"
                 # Filenames are safe to report; never output matching lines.
                 grep -aRFl -f /tmp/canaries /workspace/apps/web/.next /workspace/apps/web/app || true
                 exit 1 ;;
               1) echo "PASS web source/build canary scan"; exit 0 ;;
               *) echo "FAIL web source/build scan tool error: $result"; exit 2 ;;
             esac'
          images=()
          for service in web api worker; do
            image="$(docker compose images -q "$service")"
            if [ -z "$image" ]; then
              echo "FAIL missing runtime image for $service"; exit 1
            fi
            images+=("$image")
            if docker image history --no-trunc "$image" | grep -aF -f "$canaries" > /dev/null; then
              echo "FAIL synthetic key in $service image history"; exit 1
            else
              code=$?
              if [ "$code" -ne 1 ]; then echo "FAIL $service image-history scan error"; exit 1; fi
            fi
            echo "PASS $service image-history canary scan"
          done
          # Docker save may write either legacy layer.tar names or OCI
          # blobs/sha256/* layer names. Search the complete unpacked archive;
          # do not silently assume a particular filename layout.
          image_scan="$RUNNER_TEMP/foundation-ci-private/image-scan"
          mkdir -m 0700 "$image_scan"
          docker image save "${images[@]}" | tar -xf - -C "$image_scan"
          if [ ! -f "$image_scan/manifest.json" ] && [ ! -f "$image_scan/index.json" ]; then
            echo 'FAIL missing saved-image archive manifest'; exit 1
          fi
          if [ "$(find "$image_scan" -type f | wc -l)" -lt 3 ]; then
            echo 'FAIL saved-image archive is incomplete'; exit 1
          fi
          if grep -aRF -f "$canaries" "$image_scan" > /dev/null; then
            echo 'FAIL synthetic key in image filesystem layers'; exit 1
          else
            code=$?
            if [ "$code" -ne 1 ]; then echo 'FAIL image filesystem layer scan error'; exit 1; fi
          fi
          rm -rf "$image_scan"
          echo 'PASS synthetic secrets absent from source, web bundle, image layers/history and logs'
          {
            echo '### F-03 synthetic configuration and secret isolation'
            echo '- Active labeled synthetic policy and separate per-consumer file secrets: validated'
            echo '- API/worker protected startup, missing input denials, web process startup and canary scans: verified'
            echo '- No production numerical-policy approval or operator/migration credential granted'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo '### F-02 disposable Docker Compose integration'
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT}, SHA ${GITHUB_SHA})"
            echo '- Linux amd64 image pins, Node/Python/pip/PostgreSQL runtime versions: verified'
            echo '- Runner-host web response + denied API/DB host ports: verified'
            echo '- Web-container private API HTTP 404: verified'
            echo '- Test-container topology and DB/file persistence: 3 passing tests in seed + 3 in verify'
            echo '- Container recreation: DB/API without named-volume deletion'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: F-05 health, bounded failures, recovery and process restarts
        shell: bash
        run: |
          set -euo pipefail
          health_case() {
            scenario="$1"; shift
            docker compose --profile test run --rm --no-deps \
              -e CP_CI_PROJECT="$CP_CI_PROJECT" -e CP_HEALTH_SCENARIO="$scenario" \
              -e CP_COMPOSE_CONFIG_PATH=/tmp/foundation-compose.json \
              -v "$RUNNER_TEMP/foundation-ci-private/compose.json:/tmp/foundation-compose.json:ro" \
              test python -m pytest -q -ra --tb=short -p no:cacheprovider "$@"
          }
          worker_state() {
            expected="$1"
            for attempt in $(seq 1 25); do
              if docker compose exec -T worker python apps/worker/status.py live; then
                if docker compose exec -T worker python apps/worker/status.py ready; then actual=0; else actual=$?; fi
                if [ "$actual" = "$expected" ]; then return 0; fi
              fi
              sleep 1
            done
            echo 'FAIL worker live/readiness distinction'; return 1
          }
          export CP_MAIL_ENABLED=true CP_SMTP_HOST=mail CP_SMTP_PORT=1025
          docker compose --profile mail up -d --no-build --no-deps --force-recreate mail web
          health_case healthy tests/integration/test_health.py
          worker_state 0
          echo 'PASS healthy, incompatible baseline, bounded locked-query timeout and recovery'

          docker compose stop db
          health_case database_down tests/integration/test_health.py::test_running_service_state
          worker_state 1
          echo 'PASS database unavailable: processes live, readiness denied, worker heartbeat fresh'
          docker compose start db
          health_case healthy tests/integration/test_health.py::test_running_service_state
          worker_state 0
          echo 'PASS database recovery restores readiness'

          docker compose --profile mail stop mail
          health_case mail_down tests/integration/test_health.py::test_running_service_state
          worker_state 0
          echo 'PASS enabled mail failure affects only its consuming web boundary'
          export CP_MAIL_ENABLED=false
          docker compose up -d --no-build --no-deps --force-recreate web
          health_case mail_disabled tests/integration/test_health.py::test_running_service_state
          echo 'PASS disabled optional mail/scanner do not block core readiness'
          export CP_MAIL_ENABLED=true
          docker compose --profile mail start mail
          docker compose up -d --no-build --no-deps --force-recreate web
          health_case healthy tests/integration/test_health.py::test_running_service_state

          docker compose exec -T worker cat /tmp/carepulse-worker-status.json > "$RUNNER_TEMP/foundation-ci-private/old-worker-status.json"
          docker compose restart api worker
          health_case healthy tests/integration/test_health.py::test_running_service_state
          worker_state 0
          # Make the old heartbeat fresh so only the previous process identity can reject it.
          docker compose exec -T worker python -c 'import json,sys,time; from pathlib import Path; old=json.load(sys.stdin); old["heartbeat"]=time.monotonic(); p=Path("/tmp/previous-worker-status.json"); p.write_text(json.dumps(old)); p.chmod(0o600)' < "$RUNNER_TEMP/foundation-ci-private/old-worker-status.json"
          if docker compose exec -T worker python apps/worker/status.py live /tmp/previous-worker-status.json; then
            echo 'FAIL restarted worker accepted old process identity'; exit 1
          fi
          echo 'PASS API/worker restart: old process identity rejected; matching fresh live/ready restored'
          for service in api web worker; do
            for attempt in $(seq 1 25); do
              state="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q "$service")")"
              if [ "$state" = healthy ]; then break; fi
              if [ "$attempt" = 25 ]; then echo "FAIL Compose $service health"; exit 1; fi
              sleep 1
            done
          done
          docker compose logs --no-color web api worker > "$RUNNER_TEMP/foundation-ci-private/health-logs"
          if grep -aF -f "$RUNNER_TEMP/foundation-ci-private/canaries" "$RUNNER_TEMP/foundation-ci-private/health-logs" > /dev/null; then
            echo 'FAIL synthetic secret in health/restart logs'; exit 1
          else
            code=$?
            if [ "$code" -ne 1 ]; then echo 'FAIL health-log canary scan'; exit 1; fi
          fi
          {
            echo '### F-05 truthful service status'
            echo '- Exact minimal status/body/no-store; DB loss, revision mismatch, timeout, recovery: verified'
            echo '- Enabled-mail failure and disabled optional dependencies: verified'
            echo '- API/worker restart, fresh heartbeat and rejection of prior process identity: verified'
            echo '- Compose healthchecks healthy; service logs free of synthetic secrets'
            echo '- Foundation readiness conveys no working login or clinical capability'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up only this disposable Compose project
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COMPOSE_PROJECT_NAME" =~ ^carepulse-ci-[0-9]+-[0-9]+$ && "$COMPOSE_PROJECT_NAME" = "$CP_CI_PROJECT" \
            && -s "$CP_DB_PASSWORD_FILE" && -s "$CP_RUNTIME_DB_PASSWORD_FILE" \
            && -s "$CP_SERVICE_KEY_SOURCE_FILE" && -s "$CP_AUTH_SECRET_SOURCE_FILE" \
            && -s "$CP_FILE_ENCRYPTION_KEY_SOURCE_FILE" && -s "$CP_ACTIVE_POLICY_SOURCE_FILE" ]]; then
            docker compose --profile mail --profile test down --remove-orphans --volumes
          fi
          rm -f "$CP_DB_PASSWORD_FILE" "$CP_RUNTIME_DB_PASSWORD_FILE" "$CP_SERVICE_KEY_SOURCE_FILE" "$CP_AUTH_SECRET_SOURCE_FILE" "$CP_FILE_ENCRYPTION_KEY_SOURCE_FILE" "$RUNNER_TEMP/foundation-ci-private/compose.json" "$RUNNER_TEMP/foundation-ci-private/web-denial.log" "$RUNNER_TEMP/foundation-ci-private/worker-denial.log" "$RUNNER_TEMP/foundation-ci-private/denials.log" "$RUNNER_TEMP/foundation-ci-private/runtime-logs" "$RUNNER_TEMP/foundation-ci-private/canaries"
          rm -f "$CP_MIGRATION_SECRET_FILE" "$CP_OPERATOR_SECRET_FILE" "$RUNNER_TEMP/foundation-ci-private/roles.log"
          rm -f "$RUNNER_TEMP/foundation-ci-private/old-worker-status.json" "$RUNNER_TEMP/foundation-ci-private/health-logs"
          if [[ "$COMPOSE_PROJECT_NAME" =~ ^carepulse-ci-[0-9]+-[0-9]+$ ]]; then
            rm -rf "$RUNNER_TEMP/foundation-ci-private/image-scan"
          fi
          rmdir "$RUNNER_TEMP/foundation-ci-private" 2>/dev/null || true
